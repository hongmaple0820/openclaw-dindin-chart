name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  chat-hub:
    name: chat-hub typecheck, audit and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chat-hub
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: chat-hub/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Security audit
        run: npm audit --package-lock-only --audit-level=high

      - name: Unit tests
        run: npm test -- --runInBand

  chat-web:
    name: chat-web test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chat-web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: chat-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build
